# goal- i have to lint, build, test the code for frontend AND backend
#then push the image to docker hub
name: CI

on:
  push:
    branches: [advanced]

jobs:
  frontend:
      runs-on: ubuntu-latest
      steps: 
          - name: Checkout Code
            uses: actions/checkout@v7

          - name: Setup NodeJs
            uses: actions/setup-node@v6
            with:
              node-version: '20'
              cache: npm
              cache-dependency-path: frontend/package-lock.json

          
          - name: Install npm package
            run: npm Install
            working-directory: frontend

          - name: Run Linter
            run: npm run lint
            working-directory: frontend

          - name: Run Tests
            run: npm run test
            working-directory: frontend

